[package]
name = "item_hotkey"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
bytes = "1.11.1"
clap = { version = "4.5.58", features = ["derive"] }
eframe = "0.32.1"
egui = "0.32.1"
egui_extras = { version = "0.32.1", features = ["image"] }
futures = "0.3.31"
image = { version = "*", features = ["png"] }
keyvalues-serde = "0.2.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["full"] }
toml = "1.0.1"
vtubestudio = "0.9.0" 
